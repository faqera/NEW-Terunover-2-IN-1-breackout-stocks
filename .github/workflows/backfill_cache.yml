name: One-Time Backfill (Historical Cache)

on:
  workflow_dispatch:

jobs:
  build-backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ⬅️ यह लाइन जोड़ी है (Push करने की अनुमति के लिए)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Backfill Script (400 days history)
        run: |
          python backfill_bhavcopy_cache.py

      - name: Commit and Push the generated CSV back to Repo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add bhavcopy_history_cache.csv
          git commit -m "Added historical bhavcopy cache (backfill)" || echo "No changes to commit"
          git push
