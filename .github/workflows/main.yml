name: Update NSE Stocks to Google Sheet

on:
  schedule:
    - cron: '15 20 * * *'   # हर दिन शाम 8:15 PM IST
  workflow_dispatch:        # Manual Run के लिए

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client pandas requests yfinance

      # ---------- पहली स्क्रिप्ट: Top 250 (A, B, C) ----------
      - name: Step 1 - Fetch Top 250 Stocks
        run: python update_sheet.py
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

      # ---------- दूसरी स्क्रिप्ट: Indicators (D से J) ----------
      - name: Step 2 - Calculate Indicators & CAR Rating
        run: python update_indicators.py
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}   # यही Secret दोबारा इस्तेमाल होगा
