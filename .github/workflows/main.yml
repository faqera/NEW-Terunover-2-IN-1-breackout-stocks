name: Daily NSE Sheet Update

on:
  schedule:
    # शाम 7:00 बजे IST (1:30 PM UTC) - सोमवार से शुक्रवार
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # --- स्टेप 1: Top 250 लिस्ट (A:C) अपडेट करें ---
    - name: Step 1 - Update Top 250 Lists (Volume & Turnover)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python update_sheet.py

    # --- स्टेप 2: Technical Indicators (D:J) अपडेट करें (Live LTP के साथ) ---
    - name: Step 2 - Update Technical Indicators with INDstocks Live LTP
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        IND_TOTP_SECRET: ${{ secrets.IND_TOTP_SECRET }}
        IND_CLIENT_ID: ${{ secrets.IND_CLIENT_ID }}
        IND_MPIN: ${{ secrets.IND_MPIN }}
      run: |
        python update_nse_sheet_from_cache.py   # <-- यहाँ नाम बदलकर सही कर दिया गया है
