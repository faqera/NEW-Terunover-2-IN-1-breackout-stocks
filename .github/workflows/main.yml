name: Daily NSE Sheet Update

on:
  schedule:
    # शाम 7:00 बजे IST (1:30 PM UTC)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # --- स्टेप 1: पहले टॉप 250 की लिस्ट (A:C) अपडेट करें ---
    - name: Step 1 - Update Top 250 Lists (Volume & Turnover)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python update_top250_lists.py

    # --- स्टेप 2: फिर उसी लिस्ट के हिसाब से Technical Indicators (D:J) भरें ---
    - name: Step 2 - Update Technical Indicators (DMA/CAR/BullBear)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python update_technical_indicators.py
